<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climbing Wall Viewer</title>
<style>
  :root { --bg: #1b1d21; --panel: rgba(20, 22, 26, 0.86); --text: #e8e8e8; --muted: #9aa0a6; --route: #ffd23f; --straight: #ff5a5a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  body.drawing canvas { cursor: crosshair; }
  .panel { position: fixed; background: var(--panel); border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(4px); }
  #stats { top: 12px; left: 12px; min-width: 220px; }
  #stats h1, #routePanel h2 { font-size: 14px; margin: 0 0 6px; }
  #stats table { border-collapse: collapse; }
  #stats td { padding: 1px 10px 1px 0; }
  #stats td:first-child { color: var(--muted); }
  #fps { top: 12px; right: 12px; font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
  #controls { bottom: 12px; left: 12px; }
  #controls label { cursor: pointer; }
  #routePanel { top: 60px; right: 12px; width: 280px; max-height: calc(100vh - 150px); overflow-y: auto; }
  #routeList { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  #routeHeader { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  #routeHeader h2 { margin: 0; flex: 1; }
  #routePanel button.mini { padding: 1px 7px; font-size: 12px; }
  .route-row { display: flex; align-items: center; gap: 4px; padding-left: 6px; border: 1px solid transparent; border-radius: 6px; }
  .route-row:hover, .route-row.active { background: #2a2d33; }
  .route-row.active { border-color: var(--route); }
  .route-row input { margin: 0; accent-color: var(--route); cursor: pointer; }
  .route-row.off .rname, .route-row.off .rgrade, .route-row.off .rdot { opacity: 0.4; }
  #routePanel button.route-pick { display: flex; align-items: center; gap: 8px; flex: 1; text-align: left; padding: 4px 8px 4px 4px; border: 0; background: transparent; }
  .route-row .rdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .route-row .rname { flex: 1; }
  .route-row .rgrade { font-variant-numeric: tabular-nums; }
  .route-row .rcount { color: var(--muted); font-size: 11px; min-width: 52px; text-align: right; }
  #saveStatus { color: var(--muted); font-size: 12px; }
  #saveStatus.dirty { color: #ffb44d; }
  #saveStatus.error { color: #ff6b6b; }
  #routePanel .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
  #routePanel button { font: inherit; padding: 3px 9px; border-radius: 6px; border: 1px solid #555; background: #2a2d33; color: var(--text); cursor: pointer; }
  #routePanel button:hover { background: #353941; }
  #routePanel button.on { background: var(--route); color: #1b1d21; border-color: var(--route); font-weight: 600; }
  #routeStatus { color: var(--muted); font-size: 12px; }
  #routeStatus b { color: var(--text); font-weight: 600; }
  .swatch { display: inline-block; width: 16px; height: 3px; vertical-align: middle; margin-right: 5px; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; pointer-events: none; }
  .hint { color: var(--muted); margin-top: 4px; }
  .route-label { transform: translateY(-20px); background: rgba(15, 16, 19, 0.9); color: #fff; border-left: 3px solid var(--route); border-radius: 4px; padding: 2px 8px; font: 600 13px/1.4 system-ui, sans-serif; white-space: nowrap; pointer-events: none; }
  .route-label span { color: var(--route); margin-left: 6px; }
  @media (max-width: 700px) { #stats { font-size: 11px; min-width: 0; } #routePanel { top: auto; bottom: 96px; left: 12px; width: auto; } }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
} }
</script>
</head>
<body>
<div id="status">Loading model…</div>
<div id="stats" class="panel" hidden>
  <h1 id="modelName">Climbing wall model</h1>
  <table id="statsTable"></table>
</div>
<div id="fps" class="panel">– fps</div>
<div id="routePanel" class="panel" hidden>
  <div id="routeHeader">
    <h2 id="routeArea">Routes</h2>
    <button id="showAllBtn" class="mini" title="Show every route on the model">All</button>
    <button id="hideAllBtn" class="mini" title="Hide every route on the model">None</button>
  </div>
  <div id="routeList" role="listbox" aria-label="Routes"></div>
  <div class="row">
    <button id="drawBtn">Draw</button>
    <button id="undoBtn">Undo</button>
    <button id="clearBtn">Clear route</button>
  </div>
  <div class="row">
    <button id="saveBtn">Save routes</button>
    <span id="saveStatus"></span>
  </div>
  <div class="row"><label><input type="checkbox" id="straightChk"> Show straight segments too</label></div>
  <div class="row">Views:
    <button data-view="0,0">Front</button><button data-view="-40,0">Left</button><button data-view="40,0">Right</button><button data-view="0,25">Above</button><button data-view="0,-25">Below</button>
  </div>
  <div id="routeStatus"></div>
</div>
<div id="controls" class="panel">
  <label><input type="checkbox" id="arc"> Limit to front arc (90° across, 60° up and down, as in #11)</label>
  <div class="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { computeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

// Models live in data/models/. Pick another with ?model=../data/models/<file>.glb
const MODEL_URL = new URLSearchParams(location.search).get('model') || '../data/models/wall47.glb';
const OPENBETA_URL = '../data/openbeta/date-wall.json';
const MODEL_FILE = decodeURIComponent(MODEL_URL.split('/').pop());
// Saved routes for data/models/<name>.glb live in data/routes/<name>.json (written by scripts/viewer/serve.mjs).
const ROUTES_URL = '../data/routes/' + encodeURIComponent(MODEL_FILE.replace(/\.glb$/i, '')) + '.json';
const ROUTE_COLORS = ['#ffd23f', '#3fd0ff', '#ff5ad1', '#ff8a3d', '#7dff5a', '#b58cff', '#ffffff', '#ff5a5a'];
const STRAIGHT_COLOR = 0xff5a5a;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', top: '0', left: '0', pointerEvents: 'none' });
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d21);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.001, 1000);
let controls = null;   
let home = null;
const targets = [];
const raycaster = new THREE.Raycaster();
const lineMaterials = [];
let edge = 0.05;

const statusEl = document.getElementById('status');
const $ = (id) => document.getElementById(id);
const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function findCapturedFace(root) {
  root.updateMatrixWorld(true);
  const tri = new THREE.Triangle();
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const n = new THREE.Vector3(), mid = new THREE.Vector3();
  const areas = [], normals = [], mids = [];
  root.traverse((o) => {
    if (!o.isMesh) return;
    const pos = o.geometry.attributes.position, idx = o.geometry.index;
    const count = idx ? idx.count : pos.count;
    for (let i = 0; i < count; i += 3) {
      a.fromBufferAttribute(pos, idx ? idx.getX(i) : i).applyMatrix4(o.matrixWorld);
      b.fromBufferAttribute(pos, idx ? idx.getX(i + 1) : i + 1).applyMatrix4(o.matrixWorld);
      c.fromBufferAttribute(pos, idx ? idx.getX(i + 2) : i + 2).applyMatrix4(o.matrixWorld);
      tri.set(a, b, c);
      areas.push(tri.getArea());
      tri.getNormal(n); normals.push(n.x, n.y, n.z);
      tri.getMidpoint(mid); mids.push(mid.x, mid.y, mid.z);
    }
  });
  const sorted = Float64Array.from(areas).sort();
  const medianArea = sorted[Math.floor(sorted.length / 2)];
  const facing = new THREE.Vector3(), box = new THREE.Box3(), p = new THREE.Vector3();
  let kept = 0;
  for (let t = 0; t < areas.length; t++) {
    if (areas[t] > medianArea * 4) continue;
    facing.x += normals[3 * t]; facing.y += normals[3 * t + 1]; facing.z += normals[3 * t + 2];
    box.expandByPoint(p.set(mids[3 * t], mids[3 * t + 1], mids[3 * t + 2]));
    kept++;
  }
  return { facing: facing.normalize(), box, kept, total: areas.length, medianArea };
}

const t0 = performance.now();
const head = await fetch(MODEL_URL, { method: 'HEAD' }).catch(() => null);
const bytes = head && head.ok ? Number(head.headers.get('content-length')) : NaN;

new GLTFLoader().load(MODEL_URL, (gltf) => {
  const loadMs = performance.now() - t0;
  const root = gltf.scene;
  let tris = 0, verts = 0;
  const textures = new Map();
  root.traverse((o) => {
    if (!o.isMesh) return;
    const g = o.geometry;
    verts += g.attributes.position.count;
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    // Photogrammetry textures already contain the lighting, so render unlit.
    const src = o.material;
    if (src.map) textures.set(src.map.uuid, src.map);
    o.material = new THREE.MeshBasicMaterial({ map: src.map || null, color: src.map ? 0xffffff : 0xb0b0b0, side: THREE.DoubleSide });
    g.computeBoundsTree();
    targets.push(o);
  });
  scene.add(root);

  const face = findCapturedFace(root);
  edge = Math.sqrt(face.medianArea * 2.309);
  const center = face.box.getCenter(new THREE.Vector3());
  const radius = face.box.getSize(new THREE.Vector3()).length() / 2;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2));
  const level = new THREE.Vector3(face.facing.x, 0, face.facing.z).normalize();
  camera.up.set(0, 1, 0);
  camera.near = radius / 100; camera.far = radius * 100; camera.updateProjectionMatrix();
  camera.position.copy(center).addScaledVector(level, dist);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.copy(center);
  controls.minDistance = radius * 0.02;
  controls.maxDistance = dist * 3;
  controls.update();
  home = { az: controls.getAzimuthalAngle(), pol: controls.getPolarAngle(), target: center.clone(), dist };

  $('arc').addEventListener('change', (e) => {
    const on = e.target.checked;
    controls.minAzimuthAngle = on ? home.az - Math.PI / 4 : -Infinity;
    controls.maxAzimuthAngle = on ? home.az + Math.PI / 4 : Infinity;
    controls.minPolarAngle = on ? Math.max(0, home.pol - Math.PI / 6) : 0;
    controls.maxPolarAngle = on ? Math.min(Math.PI, home.pol + Math.PI / 6) : Math.PI;
    controls.update();
  });

  const size = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3());
  const texInfo = [...textures.values()].map((t) => `${t.image.width}×${t.image.height}`).join(', ') || 'none';
  const gl = renderer.getContext();
  $('statsTable').innerHTML =
    row('Triangles', Math.round(tris).toLocaleString()) +
    row('Vertices', verts.toLocaleString()) +
    row('Textures', `${textures.size} (${texInfo})`) +
    row('File size', isNaN(bytes) ? '?' : (bytes / 1048576).toFixed(1) + ' MB') +
    row('Load + parse', (loadMs / 1000).toFixed(2) + ' s') +
    row('Bounding box', [size.x, size.y, size.z].map((v) => v.toFixed(1)).join(' × ') + ' (model units, unscaled)') +
    row('Captured face', `${(100 * face.kept / face.total).toFixed(0)}% of triangles`) +
    row('GPU max texture', gl.getParameter(gl.MAX_TEXTURE_SIZE).toLocaleString() + ' px');
  $('modelName').textContent = decodeURIComponent(MODEL_URL.split('/').pop());
  $('stats').hidden = false;
  statusEl.remove();
  initRoutes();
  window.viewer = { THREE, scene, camera, controls, root, face, home };
  window.__viewerReady = { tris: Math.round(tris), verts, textures: texInfo, bytes, loadMs: Math.round(loadMs), edge: +edge.toFixed(4) };
}, (xhr) => {
  if (xhr.total) statusEl.textContent = `Loading model… ${Math.round(100 * xhr.loaded / xhr.total)}%`;
}, (err) => {
  statusEl.textContent = 'Failed to load model: ' + err.message;
  window.__viewerError = String(err.message || err);
});

const routes = [];
let active = null;
let drawing = false;
let dirty = false;
let area = null;

const dotMaterial = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  g.beginPath(); g.arc(32, 32, 24, 0, Math.PI * 2);
  g.fillStyle = '#ffffff'; g.fill();
  g.lineWidth = 10; g.strokeStyle = '#1b1d21'; g.stroke();
  return new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), sizeAttenuation: false, depthTest: false });
})();

function makeLine(pts, color, width, dashed = false) {
  const geom = new LineGeometry();
  geom.setPositions(pts.flatMap((p) => [p.x, p.y, p.z]));
  const mat = new LineMaterial({ color, linewidth: width, dashed, dashSize: edge * 4, gapSize: edge * 3, worldUnits: false });
  mat.resolution.set(innerWidth, innerHeight);
  lineMaterials.push(mat);
  const line = new Line2(geom, mat);
  line.computeLineDistances();
  return line;
}

function clearGroup(group) {
  for (const o of [...group.children]) {
    group.remove(o);
    if (o.isLine2) {
      o.geometry.dispose();
      o.material.dispose();
      lineMaterials.splice(lineMaterials.indexOf(o.material), 1);
    }
  }
}

function addRoute(info) {
  const color = ROUTE_COLORS[routes.length % ROUTE_COLORS.length];
  const group = new THREE.Group();
  scene.add(group);
  const labelInner = document.createElement('div');
  labelInner.className = 'route-label';
  labelInner.style.setProperty('--route', color);
  labelInner.innerHTML = `${escapeHtml(info.name)}<span>${escapeHtml(info.grade)}</span>`;
  const labelOuter = document.createElement('div');
  labelOuter.appendChild(labelInner);
  const label = new CSS2DObject(labelOuter);
  label.visible = false;
  scene.add(label);
  const r = { ...info, color, shown: true, points: [], normals: [], draped: [], stats: null, group, label };
  routes.push(r);
  return r;
}

function pick(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  raycaster.firstHitOnly = true;
  const hit = raycaster.intersectObjects(targets, false)[0];
  if (!hit) return null;
  const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
  if (n.dot(raycaster.ray.direction) > 0) n.negate();
  return { p: hit.point.clone(), n };
}

function drape(points, normals, offset) {
  const out = [], devs = [];
  let misses = 0;
  raycaster.firstHitOnly = false;
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1], na = normals[i], nb = normals[i + 1];
    const len = a.distanceTo(b);
    const steps = Math.min(600, Math.max(1, Math.ceil(len / edge)));
    const h = Math.max(len * 0.5, edge * 20);
    for (let s = 0; s < steps; s++) {
      const t = s / steps;
      const S = a.clone().lerp(b, t);
      const N = na.clone().lerp(nb, t).normalize();
      if (s === 0) { out.push(S.addScaledVector(N, offset)); devs.push(0); continue; }
      raycaster.set(S.clone().addScaledVector(N, h), N.clone().negate());
      raycaster.far = 2 * h;
      const hits = raycaster.intersectObjects(targets, false);
      if (!hits.length) { out.push(S.addScaledVector(N, offset)); devs.push(NaN); misses++; continue; }
      let best = hits[0];
      for (const hit of hits) if (Math.abs(hit.distance - h) < Math.abs(best.distance - h)) best = hit;
      devs.push(h - best.distance);
      const hn = best.face.normal.clone().transformDirection(best.object.matrixWorld);
      if (hn.dot(N) < 0) hn.negate();
      out.push(best.point.clone().addScaledVector(hn, offset));
    }
  }
  const last = points.length - 1;
  out.push(points[last].clone().addScaledVector(normals[last], offset));
  devs.push(0);
  raycaster.far = Infinity;
  raycaster.firstHitOnly = true;
  let length = 0;
  for (let i = 1; i < out.length; i++) length += out[i].distanceTo(out[i - 1]);
  return { draped: out, devs, misses, samples: out.length, length, offset };
}

function rebuild(r) {
  clearGroup(r.group);
  const isActive = r === active;
  const offset = edge * 0.35;
  if (isActive) {
    for (const p of r.points) {
      const dot = new THREE.Sprite(dotMaterial);
      dot.scale.set(0.014, 0.014, 1);
      dot.position.copy(p);
      r.group.add(dot);
    }
  }
  r.draped = [];
  r.stats = null;
  if (r.points.length >= 2) {
    r.stats = drape(r.points, r.normals, offset);
    r.draped = r.stats.draped;
    r.group.add(makeLine(r.draped, new THREE.Color(r.color), isActive ? 5 : 3.5));
    if (isActive && $('straightChk').checked) {
      const lifted = r.points.map((p, i) => p.clone().addScaledVector(r.normals[i], offset));
      r.group.add(makeLine(lifted, STRAIGHT_COLOR, 2.5, true));
    }
  }
  r.group.visible = r.shown;
  r.label.visible = r.shown && r.points.length > 0;
  if (r.points.length) r.label.position.copy(r.points[0]);
  if (isActive) updateStatus();
  renderList();
}

function renderList() {
  $('routeList').innerHTML = routes.map((r, i) =>
    `<div class="route-row${r === active ? ' active' : ''}${r.shown ? '' : ' off'}" style="--route:${r.color}">` +
    `<input type="checkbox" data-i="${i}"${r.shown ? ' checked' : ''} aria-label="Show ${escapeHtml(r.name)} on the model">` +
    `<button class="route-pick" data-i="${i}" role="option" aria-selected="${r === active}">` +
    `<span class="rdot" style="background:${r.color}"></span><span class="rname">${escapeHtml(r.name)}</span>` +
    `<span class="rgrade">${escapeHtml(r.grade)}</span>` +
    `<span class="rcount">${r.points.length ? `${r.points.length} pts` : 'not drawn'}</span></button></div>`).join('');
  for (const b of $('routeList').querySelectorAll('.route-pick')) b.onclick = () => setActive(routes[+b.dataset.i]);
  for (const c of $('routeList').querySelectorAll('input')) c.onchange = () => setShown([routes[+c.dataset.i]], c.checked);
}

const SHOWN_KEY = 'hiddenRoutes:' + MODEL_FILE;
function setShown(list, on) {
  for (const r of list) {
    r.shown = on;
    r.group.visible = on;
    r.label.visible = on && r.points.length > 0;
  }
  try { localStorage.setItem(SHOWN_KEY, JSON.stringify(routes.filter((r) => !r.shown).map((r) => r.id))); } catch (e) {}
  renderList();
}

function loadShown() {
  try {
    const hidden = new Set(JSON.parse(localStorage.getItem(SHOWN_KEY) || '[]'));
    for (const r of routes) r.shown = !hidden.has(r.id);
  } catch (e) {}
}

function setActive(r, reveal = true) {
  if (reveal && !r.shown) setShown([r], true);
  const prev = active;
  active = r;
  $('routePanel').style.setProperty('--route', r.color);
  if (prev && prev !== r) rebuild(prev);
  rebuild(r);
}

const pct = (a, b) => `${Math.round(100 * a / Math.max(b, 1))}%`;
function updateStatus() {
  const r = active, n = r.points.length, el = $('routeStatus');
  const name = `<b>${escapeHtml(r.name)}</b>`;
  if (!n) { el.innerHTML = `${name}: click <b>Draw</b>, then click holds on the wall from the start upward. Esc stops drawing; Ctrl+Z undoes a point.`; return; }
  if (n < 2) { el.innerHTML = `${name}: 1 point. Click the next hold.`; return; }
  const d = r.stats, valid = d.devs.filter(Number.isFinite), abs = valid.map(Math.abs);
  const tol = d.offset * 3;
  const floats = valid.filter((v) => v < -tol).length, sinks = valid.filter((v) => v > tol).length;
  el.innerHTML =
    `${name}: ${n} points, ${d.length.toFixed(2)} units long, draped over ${d.samples} surface samples` +
    (d.misses ? `, <b>${d.misses} over holes</b>` : '') + '.<br>' +
    `<span class="swatch" style="background:#ff5a5a"></span>Straight segments would stray up to <b>${Math.max(...abs).toFixed(2)}</b> units ` +
    `(mean ${(abs.reduce((s, v) => s + v, 0) / abs.length).toFixed(3)}): ${pct(floats, valid.length)} floating, ${pct(sinks, valid.length)} sunk in.`;
}

function setDirty(on) {
  dirty = on;
  const el = $('saveStatus');
  el.className = on ? 'dirty' : '';
  if (on) el.textContent = 'Unsaved changes';
}

function routesJSON() {
  const r4 = (v) => v.toArray().map((x) => +x.toFixed(4));
  return {
    model: 'data/models/' + MODEL_FILE,
    area: area ? { name: area.area_name, openbeta_uuid: area.uuid } : null,
    updated: new Date().toISOString(),
    routes: routes.filter((r) => r.points.length).map((r) => ({
      openbeta_uuid: r.id,
      name: r.name,
      grade: r.grade,
      points: r.points.map(r4),
      normals: r.normals.map(r4),
    })),
  };
}

async function saveRoutes() {
  const el = $('saveStatus');
  $('saveBtn').disabled = true;
  try {
    const res = await fetch(ROUTES_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(routesJSON()) });
    if (!res.ok) throw new Error((await res.text()) || `HTTP ${res.status}`);
    setDirty(false);
    el.textContent = `Saved ${new Date().toLocaleTimeString()} to data/routes/${decodeURIComponent(ROUTES_URL.split('/').pop())}`;
  } catch (e) {
    el.className = 'error';
    el.textContent = `Save failed: ${e.message}. Is scripts/viewer/serve.mjs running?`;
  } finally {
    $('saveBtn').disabled = false;
  }
}

async function loadRoutes() {
  const el = $('saveStatus');
  try {
    const res = await fetch(ROUTES_URL, { cache: 'no-store' });
    if (res.status === 404) { el.textContent = 'No saved routes yet'; return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const saved = await res.json();
    for (const s of saved.routes || []) {
      const r = routes.find((x) => x.id === s.openbeta_uuid) || addRoute({ id: s.openbeta_uuid, name: s.name, grade: s.grade });
      r.points = s.points.map((a) => new THREE.Vector3(...a));
      r.normals = s.normals.map((a) => new THREE.Vector3(...a));
    }
    el.textContent = `Loaded ${(saved.routes || []).length} saved route(s)`;
  } catch (e) {
    el.className = 'error';
    el.textContent = `Could not load saved routes: ${e.message}`;
  }
}

function setDrawing(on) {
  drawing = on;
  $('drawBtn').classList.toggle('on', on);
  $('drawBtn').textContent = on ? 'Drawing… (Esc)' : 'Draw';
  document.body.classList.toggle('drawing', on);
}

function undo() {
  if (!active || !active.points.length) return;
  active.points.pop();
  active.normals.pop();
  rebuild(active);
  setDirty(true);
}

function routeFrame() {
  const draped = active ? active.draped : [];
  if (draped.length < 2) return { target: home.target, dist: home.dist };
  const box = new THREE.Box3().setFromPoints(draped);
  const r = Math.max(box.getSize(new THREE.Vector3()).length() / 2, edge * 40);
  return { target: box.getCenter(new THREE.Vector3()), dist: (r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.25 };
}

function setView(azDeg, elDeg) {
  const frame = routeFrame();
  const toYUp = new THREE.Quaternion().setFromUnitVectors(camera.up, new THREE.Vector3(0, 1, 0));
  const sph = new THREE.Spherical(frame.dist, home.pol - THREE.MathUtils.degToRad(elDeg), home.az + THREE.MathUtils.degToRad(azDeg));
  const offset = new THREE.Vector3().setFromSpherical(sph).applyQuaternion(toYUp.invert());
  controls.target.copy(frame.target);
  camera.position.copy(frame.target).add(offset);
  controls.update();
}

async function initRoutes() {
  try {
    area = (await (await fetch(OPENBETA_URL)).json()).data.area;
    $('routeArea').textContent = `Routes · ${area.area_name} (OpenBeta)`;
    const climbs = area.climbs.slice().sort((a, b) => (a.metadata?.leftRightIndex ?? 0) - (b.metadata?.leftRightIndex ?? 0));
    for (const c of climbs) addRoute({ id: c.uuid, name: c.name, grade: c.grades?.yds || '?' });
  } catch (e) {
    $('routeArea').textContent = 'Routes (OpenBeta data not found)';
  }
  await loadRoutes();
  $('routePanel').hidden = false;
  if (!routes.length) { $('routeStatus').textContent = `No routes to draw: ${OPENBETA_URL} did not load.`; return; }

  $('drawBtn').onclick = () => setDrawing(!drawing);
  $('undoBtn').onclick = undo;
  $('clearBtn').onclick = () => {
    if (!active.points.length || !confirm(`Clear the line for ${active.name}?`)) return;
    active.points = []; active.normals = [];
    rebuild(active);
    setDirty(true);
  };
  $('saveBtn').onclick = saveRoutes;
  $('straightChk').onchange = () => rebuild(active);
  for (const b of document.querySelectorAll('[data-view]')) {
    b.onclick = () => { const [az, el] = b.dataset.view.split(',').map(Number); setView(az, el); };
  }

  let down = null;
  renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now(), button: e.button }; });
  renderer.domElement.addEventListener('pointerup', (e) => {
    const d = down;
    down = null;
    if (!drawing || !active || !d || d.button !== 0) return;
    if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 6 || performance.now() - d.t > 600) return;
    const hit = pick(e.clientX, e.clientY);
    if (!hit) { $('routeStatus').innerHTML = '<b>Missed the model.</b> Click on the wall.'; return; }
    if (!active.shown) setShown([active], true);
    active.points.push(hit.p);
    active.normals.push(hit.n);
    rebuild(active);
    setDirty(true);
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && drawing) setDrawing(false);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  });
  addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  $('showAllBtn').onclick = () => setShown(routes, true);
  $('hideAllBtn').onclick = () => setShown(routes, false);

  loadShown();
  for (const r of routes) rebuild(r);
  setActive(routes.find((r) => r.shown) || routes[0], false);
  window.routeTool = { routes, get active() { return active; }, setActive, setShown, routesJSON, saveRoutes, setView, get dirty() { return dirty; } };
}

const fpsEl = $('fps');
let frames = 0, last = performance.now();
renderer.setAnimationLoop(() => {
  if (controls) controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - last >= 500) { fpsEl.textContent = Math.round(frames * 1000 / (now - last)) + ' fps'; frames = 0; last = now; }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
  for (const m of lineMaterials) m.resolution.set(innerWidth, innerHeight);
});
</script>
</body>
</html>
